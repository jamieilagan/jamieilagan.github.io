<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jamieilagan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://fonts.googleapis.com/css?family=Jersey+25' rel='stylesheet'>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body style="background: linear-gradient(to top, #4b6a5c 10%, #97b6a8 30%, #d5e5d5 100%);">
    <!-- Navigation Bar -->
    <div class="container shadow p-2 my-4 rounded position-sticky top-0 z-1 glass-navbar" style="font-family: 'Jersey 25', sans-serif;">
        <div class="row align-items-center flex-nowrap">
            <div class="col d-flex justify-content-center align-items-center gap-2">
                <a class="nav-link" href="index.html">About</a>
                <img src="assets/images/logo.svg" alt="Website Logo" width="174" height="42">
                <a class="nav-link active" href="projects.html">Projects</a>
            </div>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="container shadow p-4 my-4 rounded glass">
        <div class="profile-card flex-column flex-md-row justify-content-center align-items-center" id="profile-card">
            <img src="assets/images/picture.png" alt="picture">
            <div class="profile-info text-center">
                <h2 style="font-family: 'Jersey 25', sans-serif;">
                    I am <span class="name">Jan Maridel Ilagan</span>
                    <div class="subtitle">UI/UX Designer & Programmer</div>
                </h2>
                <div class="desc">
                    A third year student at<br>
                    <span><strong>Polytechnic University of the Philippines<br>Sto. Tomas Campus</strong></span><br>
                    taking the program<br>
                    <span><strong>Bachelor of Science in Information Technology</strong></span>
                </div>
            </div>
        </div>
        <div class="row pb-3 justify-content-center align-items-center" style="font-family: 'Jersey 25', sans-serif;">
            <div class="col-8 justify-content-center d-flex align-items-center gap-2">
                <img class="icon-location" src="assets/images/location.png" alt="Location">
                <span class="subtitle text-center mt-2">Talisay, Batangas</span>
            </div>
        </div>
    </div>

    <!-- Works -->
    <div class="container shadow py-4 my-4 rounded text-center glass">
        <div class="row">
            <div class="col border-bottom pb-3 mb-4" style="font-family: 'Jersey 25', sans-serif;">
                <div class="h4">My Works</div>
                <nav aria-label="breadcrumb" class="mt-3">
                    <ol class="breadcrumb justify-content-center mb-0">
                        <li class="breadcrumb-item active" aria-current="page">
                            <button class="category-toggle active" data-category="all">All Works</button>
                        </li>
                        <li class="breadcrumb-item">
                            <button class="category-toggle" data-category="current">Website Works</button>
                        </li>
                        <li class="breadcrumb-item">
                            <button class="category-toggle" data-category="developed">Developed Applications</button>
                        </li>
                        <li class="breadcrumb-item">
                            <button class="category-toggle" data-category="multimedia">Multimedia Works</button>
                        </li>
                    </ol>
                </nav>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-md-2 g-4 p-4 mx-5" id="contents">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
        <script src="assets/projectsWD.js"></script>

    <script>
        var contents = document.getElementById("contents");
        var categoryButtons = document.querySelectorAll(".category-toggle");

        function renderProjects(category) {
            var filteredProjects = projects.filter(function (project) {
                return category === "all" || project.category === category;
            });

            if (filteredProjects.length === 0) {
                contents.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-light text-success" role="status">
                            No works in this section yet.
                        </div>
                    </div>
                `;
                return;
            }

            contents.innerHTML = filteredProjects.map(function (project) {
                return `
                    <div class="col p-4">
                        <div class="card shadow mx-2 h-100">
                            <img src="` + project.image + `" class="card-img-top" alt="` + project.Activity + `">
                            <div class="card-body">
                                <h5 class="card-title text-success" style="font-family: 'Jersey 25', sans-serif;">` + project.Activity + `</h5>
                                <p class="card-text">` + project.description + `</p>
                                <a href="` + project.link + `"
                                    class="btn btn-outline-success btn-sm px-3 mt-2" style="font-family: 'Jersey 25', sans-serif;" target="_blank" rel="noopener noreferrer">Explore Page</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        categoryButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                categoryButtons.forEach(function (item) {
                    item.classList.remove("active");
                    item.closest(".breadcrumb-item").classList.remove("active");
                });

                button.classList.add("active");
                button.closest(".breadcrumb-item").classList.add("active");
                renderProjects(button.getAttribute("data-category"));
            });
        });

        renderProjects("all");
    </script>
</body>

</html>
